name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --parallel

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 14

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/
          retention-days: 14

  spotbugs:
    name: SpotBugs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run SpotBugs
        run: ./gradlew spotbugsMain --no-daemon

      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: "**/build/spotbugsResults/*.html"
          retention-days: 14

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, spotbugs]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: docs/jacoco

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: docs/test-reports

      - name: Download SpotBugs reports
        uses: actions/download-artifact@v4
        with:
          name: spotbugs-reports
          path: docs/spotbugs

      - name: Create index pages
        run: |
          # Main index page
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>ha-jdbc Reports</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
              h1 { color: #333; }
              ul { list-style: none; padding: 0; }
              li { margin: 10px 0; }
              a { text-decoration: none; color: #0366d6; font-size: 18px; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>ha-jdbc Build Reports</h1>
            <ul>
              <li><a href="jacoco/index.html">📊 JaCoCo Coverage Report</a></li>
              <li><a href="test-reports/index.html">🧪 Test Reports</a></li>
              <li><a href="spotbugs/index.html">🐛 SpotBugs Reports</a></li>
            </ul>
          </body>
          </html>
          EOF

          # Test reports index page
          cat > docs/test-reports/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Test Reports</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
              h1 { color: #333; }
              ul { list-style: none; padding: 0; }
              li { margin: 10px 0; }
              a { text-decoration: none; color: #0366d6; font-size: 16px; }
              a:hover { text-decoration: underline; }
              a.back { color: #666; font-size: 14px; }
            </style>
          </head>
          <body>
            <p><a href="../index.html" class="back">← Back to Reports</a></p>
            <h1>🧪 Test Reports</h1>
            <ul>
              <li><a href="core/index.html">core</a></li>
              <li><a href="distributed/index.html">distributed</a></li>
              <li><a href="distributed/jgroups/index.html">distributed:jgroups</a></li>
              <li><a href="i18n/index.html">i18n</a></li>
              <li><a href="i18n/gettext/index.html">i18n:gettext</a></li>
              <li><a href="logging/index.html">logging</a></li>
              <li><a href="logging/commons/index.html">logging:commons</a></li>
              <li><a href="logging/slf4j/index.html">logging:slf4j</a></li>
              <li><a href="state/index.html">state</a></li>
              <li><a href="state/leveldb/index.html">state:leveldb</a></li>
              <li><a href="state/sqlite/index.html">state:sqlite</a></li>
              <li><a href="test/index.html">test</a></li>
            </ul>
          </body>
          </html>
          EOF

          # SpotBugs index page
          cat > docs/spotbugs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>SpotBugs Reports</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
              h1 { color: #333; }
              ul { list-style: none; padding: 0; }
              li { margin: 10px 0; }
              a { text-decoration: none; color: #0366d6; font-size: 16px; }
              a:hover { text-decoration: underline; }
              a.back { color: #666; font-size: 14px; }
            </style>
          </head>
          <body>
            <p><a href="../index.html" class="back">← Back to Reports</a></p>
            <h1>🐛 SpotBugs Reports</h1>
            <ul>
              <li><a href="core.html">core</a></li>
              <li><a href="distributed.html">distributed</a></li>
              <li><a href="distributed-jgroups.html">distributed:jgroups</a></li>
              <li><a href="i18n.html">i18n</a></li>
              <li><a href="i18n-gettext.html">i18n:gettext</a></li>
              <li><a href="logging.html">logging</a></li>
              <li><a href="logging-commons.html">logging:commons</a></li>
              <li><a href="logging-slf4j.html">logging:slf4j</a></li>
              <li><a href="state.html">state</a></li>
              <li><a href="state-leveldb.html">state:leveldb</a></li>
              <li><a href="state-sqlite.html">state:sqlite</a></li>
              <li><a href="test.html">test</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
