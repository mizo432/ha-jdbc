spring:
  application:
    name: sample-springboot4

  # JPA / Hibernate settings for MSSQL
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
        envers:
          store_data_at_delete: true

  # Flyway settings
  flyway:
    enabled: true
    locations: classpath:db/migration/mssql
    baseline-on-migrate: true
    clean-disabled: true

  # Virtual Threads
  threads:
    virtual:
      enabled: true

# Database credentials for MSSQL
database:
  master:
    url: ${DB_MASTER_URL:jdbc:sqlserver://localhost:1433;databaseName=sample_db;encrypt=false;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:Sample@1234}
  slave:
    url: ${DB_SLAVE_URL:jdbc:sqlserver://localhost:1434;databaseName=sample_db;encrypt=false;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:Sample@1234}
  state:
    password: ${DB_STATE_PASSWORD:}

# Server settings
server:
  port: 8080

# Logging
logging:
  level:
    root: WARN
    com.example.sample: INFO
    net.sf.hajdbc: INFO
    org.hibernate.SQL: WARN
