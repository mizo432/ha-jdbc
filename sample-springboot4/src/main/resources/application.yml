spring:
  application:
    name: sample-springboot4

  # DataSource settings - HA-JDBC manages the data sources
  # Commented out because HA-JDBC provides its own DataSource bean
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/sample_db
  #   username: sample_user
  #   password: sample_password
  #   driver-class-name: org.postgresql.Driver

  # JPA / Hibernate settings
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        envers:
          store_data_at_delete: true

  # Flyway settings - disabled because we run migrations manually via FlywayConfig
  # to migrate both master and slave databases directly, bypassing ha-jdbc proxy
  flyway:
    enabled: false

  # Virtual Threads
  threads:
    virtual:
      enabled: true

# Database credentials (use environment variables in production)
database:
  master:
    url: ${DB_MASTER_URL:jdbc:postgresql://localhost:5432/sample_db}
    username: ${DB_USERNAME:sample_user}
    password: ${DB_PASSWORD:sample_password}
  slave:
    url: ${DB_SLAVE_URL:jdbc:postgresql://localhost:5433/sample_db}
    username: ${DB_USERNAME:sample_user}
    password: ${DB_PASSWORD:sample_password}
  state:
    password: ${DB_STATE_PASSWORD:}

# Server settings
server:
  port: 8080

# Logging
logging:
  level:
    root: WARN
    com.example.sample: INFO
    net.sf.hajdbc: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
