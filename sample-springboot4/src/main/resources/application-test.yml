spring:
  application:
    name: sample-springboot4

  # H2 in-memory database for testing
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # JPA / Hibernate settings
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Flyway settings - disabled for testing
  flyway:
    enabled: false

# Server settings
server:
  port: 8080

# Logging
logging:
  level:
    root: WARN
    com.example.sample: INFO
