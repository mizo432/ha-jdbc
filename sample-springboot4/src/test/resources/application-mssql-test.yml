spring:
  application:
    name: sample-springboot4

  # Use H2 in-memory database for MSSQL-compatible tests
  # This simulates MSSQL behavior using HA-JDBC MSSQL dialect
  datasource:
    url: jdbc:h2:mem:mssqldb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # JPA / Hibernate settings - use MSSQL dialect
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        envers:
          store_data_at_delete: true

  # Disable Flyway for tests
  flyway:
    enabled: false

  # Virtual Threads
  threads:
    virtual:
      enabled: true

# Server settings
server:
  port: 8080

# Logging
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
