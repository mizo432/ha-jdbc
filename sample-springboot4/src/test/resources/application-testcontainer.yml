spring:
  application:
    name: sample-springboot4

  # JPA / Hibernate settings
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        envers:
          store_data_at_delete: true

  # Disable Flyway for tests - use Hibernate DDL auto
  flyway:
    enabled: false

  # Virtual Threads
  threads:
    virtual:
      enabled: true

# Database credentials - will be overridden by Testcontainers at runtime
database:
  master:
    url: jdbc:tc:postgresql:///sample_db
    username: test
    password: test
  slave:
    url: jdbc:tc:postgresql:///sample_db
    username: test
    password: test
  state:
    password:

# Server settings
server:
  port: 8080

# Logging
logging:
  level:
    root: WARN
    com.example.sample: DEBUG
    net.sf.hajdbc: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
